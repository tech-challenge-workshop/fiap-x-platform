name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  topology:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Render the compose topology
        run: docker compose config > rendered-compose.yml
      - name: Assert every service declares a build context or an image
        run: |
          python3 - <<'PY'
          import sys, yaml
          doc = yaml.safe_load(open('rendered-compose.yml')) or {}
          services = doc.get('services') or {}
          missing = sorted(n for n, v in services.items() if not (v or {}).get('build') and not (v or {}).get('image'))
          if missing:
              print('services with neither build nor image: ' + ', '.join(missing))
              sys.exit(1)
          print(str(len(services)) + ' services validated')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the Worker's CPU limit matches its thread count
        run: node scripts/check-worker-sizing.mjs
      - name: Prove each sizing comparison rejects a bad value
        run: node scripts/check-worker-sizing.mjs --self-test
      - name: Check no script writes into the bucket outside the API
        run: node scripts/check-no-storage-writes.mjs
      - name: Prove the storage-write check names each kind of write
        run: node scripts/check-no-storage-writes.mjs --self-test
      - name: Check the smoke script parses
        run: node --check scripts/smoke-local-integration.mjs
      - name: Prove each smoke assertion rejects a bad input
        run: node scripts/smoke-local-integration.mjs --self-test
      - name: Prove each bootstrap scenario rejects a bad outcome
        run: node scripts/check-storage-bootstrap.mjs --self-test
      - name: Prove each identity check rejects a bad observation
        run: node scripts/check-identity.mjs --self-test
      - name: Prove the database-script drift check fails on a changed script
        run: node scripts/generate-db-script.mjs --self-test
      - name: Check the integration job always runs the stack
        run: node scripts/check-ci-governance.mjs
      - name: Prove the CI governance check rejects a skip path
        run: node scripts/check-ci-governance.mjs --self-test
      - name: Prove the link check fails on a broken link
        run: node scripts/check-docs-links.mjs --self-test
      - name: Prove the required-checks applier replaces the list exactly
        run: node scripts/apply-required-checks.mjs --self-test
      - name: Check the monitoring configuration and its compose wiring
        run: node scripts/check-observability.mjs
      - name: Prove each observability check rejects a corruption
        run: node scripts/check-observability.mjs --self-test
      - name: Prove the load test names a video that does not complete
        run: node scripts/load-test.mjs --self-test


  integration:
    needs: topology
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: fiap-x-platform
      - uses: actions/checkout@v4
        with:
          repository: tech-challenge-workshop/fiap-x-api
          path: fiap-x-api
      - uses: actions/checkout@v4
        with:
          repository: tech-challenge-workshop/processing-catalog
          path: processing-catalog
      - uses: actions/checkout@v4
        with:
          repository: tech-challenge-workshop/processing-worker
          path: processing-worker
      - uses: actions/checkout@v4
        with:
          repository: tech-challenge-workshop/notification-service
          path: notification-service
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start the stack and wait for every health check
        working-directory: fiap-x-platform
        run: docker compose up --build -d --wait
      - name: Run the storage-bootstrap scenarios
        working-directory: fiap-x-platform
        run: node scripts/check-storage-bootstrap.mjs
      - name: Check the database script has not drifted from the migrations
        working-directory: fiap-x-platform
        run: node scripts/generate-db-script.mjs --check
      - name: Run the smoke test against the live stack
        working-directory: fiap-x-platform
        run: node scripts/smoke-local-integration.mjs
      - name: Check the identity service
        working-directory: fiap-x-platform
        run: node scripts/check-identity.mjs
      - name: Force-recreate identity, storage-init and api
        working-directory: fiap-x-platform
        run: docker compose up -d --wait --force-recreate identity storage-init api
      - name: Run the smoke test again after the recreate
        working-directory: fiap-x-platform
        run: node scripts/smoke-local-integration.mjs
      - name: Check the identity service again after the recreate
        working-directory: fiap-x-platform
        run: node scripts/check-identity.mjs
      - name: Run a small concurrent load
        working-directory: fiap-x-platform
        run: node scripts/load-test.mjs --videos 3
      - name: Check every service is scraped and the dashboard provisioned
        working-directory: fiap-x-platform
        run: node scripts/check-observability.mjs --live
      - name: Collect container logs
        if: failure()
        working-directory: fiap-x-platform
        run: docker compose logs --no-color > container-logs.txt
      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: container-logs
          path: fiap-x-platform/container-logs.txt
      - name: Tear the stack down
        if: always()
        working-directory: fiap-x-platform
        run: docker compose down -v

  docs-links:
    # A required check (ci/required-checks.json): an unresolved relative link
    # in README.md or docs/ fails it, so it blocks the merge.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Report relative links that do not resolve
        run: node scripts/check-docs-links.mjs
