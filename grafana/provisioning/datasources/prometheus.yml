# Grafana's only datasource (OBS-62), provisioned from this file on every
# start: nothing is configured by hand in the UI. The dashboards reference it
# by the fixed uid `prometheus`, so a rename here cannot orphan a panel
# unnoticed: scripts/check-observability.mjs requires every panel to name
# this uid.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
