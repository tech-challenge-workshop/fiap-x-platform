# Grafana, the Compose `grafana` service (OBS-62, OBS-65) on the cluster
# (K8S-27). The datasource, the dashboard provider and the overview dashboard
# come from the same files Compose mounts, through the ConfigMaps kustomize
# generates from them (fiapx-grafana-datasources, -dashboard-provider,
# -dashboards); each file is mounted by subPath at the path Compose gives it,
# since a ConfigMap directory mount also carries the kubelet's `..data`
# links and the dashboard provider would walk them. No volume for Grafana's
# own state: a recreated pod comes back with the repository's state, as the
# Compose container does.
#
# The admin user and password come from Secret `fiapx-grafana-admin`, which
# the up command generates. Grafana listens on its default 3000 in the pod;
# `grafana-host` publishes it on nodePort 30005, which the kind config maps
# to host port 3005 (Compose's port, since 3000 is the API's).
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    app: grafana
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-host
  labels:
    app: grafana
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30005
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:13.2.2
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: fiapx-grafana-admin
                  key: GF_SECURITY_ADMIN_USER
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fiapx-grafana-admin
                  key: GF_SECURITY_ADMIN_PASSWORD
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml
              subPath: dashboards.yml
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards/overview.json
              subPath: overview.json
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: datasources
          configMap:
            name: fiapx-grafana-datasources
        - name: dashboard-provider
          configMap:
            name: fiapx-grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: fiapx-grafana-dashboards
