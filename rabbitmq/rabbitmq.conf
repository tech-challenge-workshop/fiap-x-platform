# Applied by compose at /etc/rabbitmq/conf.d. Kept minimal on purpose: the
# platform configures the definitions file, which carries the topology - the
# quorum default for the vhost, the traffic queues and their dead-letter
# queues, and the dead-letter policy - and the metrics endpoint.
load_definitions = /etc/rabbitmq/definitions.json

# OBS-63: the rabbitmq_prometheus plugin (enabled by rabbitmq/enabled_plugins)
# serves /metrics on this port, stated even though it is the default so the
# scrape target in prometheus/prometheus.yml has a visible source. By default
# the plugin aggregates every queue into one series; per-object metrics give
# rabbitmq_queue_messages a `queue` label, which the dashboard needs for the
# depth of video-validation, processing and notification.terminal.
prometheus.tcp.port = 15692
prometheus.return_per_object_metrics = true
