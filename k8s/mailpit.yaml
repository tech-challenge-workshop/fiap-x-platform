# Mailpit, the Compose `mailpit` SMTP sink (RF-5) on the cluster. Services
# send mail to mailpit:1025 inside the cluster; `mailpit-host` publishes only
# the web UI and API (8025) on nodePort 30825, as Compose publishes only 8025.
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  labels:
    app: mailpit
spec:
  type: ClusterIP
  selector:
    app: mailpit
  ports:
    - name: smtp
      port: 1025
      targetPort: smtp
    - name: http
      port: 8025
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit-host
  labels:
    app: mailpit
spec:
  type: NodePort
  selector:
    app: mailpit
  ports:
    - name: http
      port: 8025
      targetPort: http
      nodePort: 30825
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  labels:
    app: mailpit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailpit
  template:
    metadata:
      labels:
        app: mailpit
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.31.2
          ports:
            - name: smtp
              containerPort: 1025
            - name: http
              containerPort: 8025
          # Absolute path: the image puts the binary at /mailpit, not on PATH.
          readinessProbe:
            exec:
              command:
                - /mailpit
                - readyz
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
