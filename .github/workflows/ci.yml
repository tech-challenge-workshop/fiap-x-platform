name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  topology:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Render the compose topology
        run: docker compose config > rendered-compose.yml
      - name: Assert every service declares a build context or an image
        run: |
          python3 - <<'PY'
          import sys, yaml
          doc = yaml.safe_load(open('rendered-compose.yml')) or {}
          services = doc.get('services') or {}
          missing = sorted(n for n, v in services.items() if not (v or {}).get('build') and not (v or {}).get('image'))
          if missing:
              print('services with neither build nor image: ' + ', '.join(missing))
              sys.exit(1)
          print(str(len(services)) + ' services validated')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the Worker's CPU limit matches its thread count
        run: node scripts/check-worker-sizing.mjs
      - name: Prove each sizing comparison rejects a bad value
        run: node scripts/check-worker-sizing.mjs --self-test
      - name: Check no script writes into the bucket outside the API
        run: node scripts/check-no-storage-writes.mjs
      - name: Prove the storage-write check names each kind of write
        run: node scripts/check-no-storage-writes.mjs --self-test
      - name: Check the smoke script parses
        run: node --check scripts/smoke-local-integration.mjs
      - name: Prove each smoke assertion rejects a bad input
        run: node scripts/smoke-local-integration.mjs --self-test
      - name: Prove each bootstrap scenario rejects a bad outcome
        run: node scripts/check-storage-bootstrap.mjs --self-test
      - name: Prove each identity check rejects a bad observation
        run: node scripts/check-identity.mjs --self-test
      - name: Prove the database-script drift check fails on a changed script
        run: node scripts/generate-db-script.mjs --self-test

  integration:
    needs: topology
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Determine whether cross-repository access is available
        id: access
        env:
          TOKEN: ${{ secrets.SERVICES_READ_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No cross-repository token configured; skipping the integration run."
          fi
      - uses: actions/checkout@v4
        if: steps.access.outputs.available == 'true'
        with:
          path: fiap-x-platform
      - uses: actions/checkout@v4
        if: steps.access.outputs.available == 'true'
        with:
          repository: tech-challenge-workshop/fiap-x-api
          path: fiap-x-api
          token: ${{ secrets.SERVICES_READ_TOKEN }}
      - uses: actions/checkout@v4
        if: steps.access.outputs.available == 'true'
        with:
          repository: tech-challenge-workshop/processing-catalog
          path: processing-catalog
          token: ${{ secrets.SERVICES_READ_TOKEN }}
      - uses: actions/checkout@v4
        if: steps.access.outputs.available == 'true'
        with:
          repository: tech-challenge-workshop/processing-worker
          path: processing-worker
          token: ${{ secrets.SERVICES_READ_TOKEN }}
      - uses: actions/checkout@v4
        if: steps.access.outputs.available == 'true'
        with:
          repository: tech-challenge-workshop/notification-service
          path: notification-service
          token: ${{ secrets.SERVICES_READ_TOKEN }}
      - name: Start the stack and wait for every health check
        if: steps.access.outputs.available == 'true'
        working-directory: fiap-x-platform
        run: docker compose up --build -d --wait
      - name: Run the smoke test against the live stack
        if: steps.access.outputs.available == 'true'
        working-directory: fiap-x-platform
        run: node scripts/smoke-local-integration.mjs
      - name: Collect container logs
        if: failure() && steps.access.outputs.available == 'true'
        working-directory: fiap-x-platform
        run: docker compose logs --no-color > container-logs.txt
      - name: Upload container logs
        if: failure() && steps.access.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: container-logs
          path: fiap-x-platform/container-logs.txt
      - name: Tear the stack down
        if: always() && steps.access.outputs.available == 'true'
        working-directory: fiap-x-platform
        run: docker compose down -v

  docs-links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Report relative links that do not resolve
        run: |
          python3 - <<'PY'
          import re, pathlib
          root = pathlib.Path('.')
          files = [root / 'README.md'] + sorted(root.glob('docs/**/*.md'))
          missing = []
          for f in files:
              if not f.exists():
                  continue
              for text, target in re.findall(r'\[([^\]]*)\]\(([^)]+)\)', f.read_text()):
                  if re.match(r'^(https?:|mailto:|#)', target):
                      continue
                  t = target.split('#')[0].strip()
                  if t and not (f.parent / t).exists():
                      missing.append(str(f) + ': [' + text + '](' + target + ')')
          print('\n'.join(missing) if missing else 'all relative links resolve')
          print(str(len(missing)) + ' unresolved link(s) - informational only')
          PY
