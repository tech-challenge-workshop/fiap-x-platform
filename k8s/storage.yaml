# RustFS, the Compose `storage` service on the cluster: the S3 API on 9000
# (AD-014). The root credentials come from Secret `fiapx-storage`, generated
# per cluster by scripts/k8s-up.mjs; every S3 client (storage-init, the API,
# the Worker, the smoke) reads the same keys.
#
# Two Services: `storage` for the pods (storage:9000, as in Compose) and
# `storage-host`, which publishes the S3 API on the host through the kind
# port map (STORAGE_HOST_PORT, default 9000). Presigned URLs name that host
# port, so they must reach this server unchanged.
apiVersion: v1
kind: Service
metadata:
  name: storage
  labels:
    app: storage
spec:
  type: ClusterIP
  selector:
    app: storage
  ports:
    - name: s3
      port: 9000
      targetPort: s3
---
apiVersion: v1
kind: Service
metadata:
  name: storage-host
  labels:
    app: storage
spec:
  type: NodePort
  selector:
    app: storage
  ports:
    - name: s3
      port: 9000
      targetPort: s3
      nodePort: 30900
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: storage
  labels:
    app: storage
spec:
  serviceName: storage
  replicas: 1
  selector:
    matchLabels:
      app: storage
  template:
    metadata:
      labels:
        app: storage
    spec:
      # The image runs as rustfs (10001); the group makes the claim writable
      # on a provisioner that honours fsGroup.
      securityContext:
        fsGroup: 10001
      containers:
        - name: storage
          image: rustfs/rustfs:1.0.0
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: fiapx-storage
                  key: ACCESS_KEY
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: fiapx-storage
                  key: SECRET_KEY
          ports:
            - name: s3
              containerPort: 9000
          # An HTTP probe of the server itself, not a TCP one: a listening
          # socket is not a serving S3 API.
          readinessProbe:
            httpGet:
              path: /health
              port: s3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
