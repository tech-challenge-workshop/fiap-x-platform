# The Notification service on the cluster: the Compose `notification` service
# with the image CI publishes on main (kustomize maps `notification-service`
# to ghcr.io/tech-challenge-workshop/notification-service:main). Its database
# role password is the `db/init` fixture, read from Secret `fiapx-postgres`;
# the broker URL comes from Secret `fiapx-rabbitmq`. Mail goes to the
# in-cluster Mailpit on mailpit:1025.
#
# There is no depends_on: the service retries its database and broker
# connections, and /health answers 503 until they are up (S8), so readiness
# gates traffic. Liveness reads /health/live, which never depends on them.
#
# Two Services: `notification` for the pods and `notification-host` on
# nodePort 30003, which the kind port map publishes on host port 3003.
apiVersion: v1
kind: Service
metadata:
  name: notification
  labels:
    app: notification
spec:
  type: ClusterIP
  selector:
    app: notification
  ports:
    - name: http
      port: 3003
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: notification-host
  labels:
    app: notification
spec:
  type: NodePort
  selector:
    app: notification
  ports:
    - name: http
      port: 3003
      targetPort: http
      nodePort: 30003
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  labels:
    app: notification
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
    spec:
      containers:
        - name: notification
          image: notification-service
          imagePullPolicy: Always
          env:
            - name: PORT
              value: "3003"
            - name: LOCAL_INTEGRATION
              value: "true"
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: fiapx-rabbitmq
                  key: URL
            - name: DATABASE_HOST
              value: postgres
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_NAME
              value: fiapx
            - name: DATABASE_SCHEMA
              value: notification
            - name: DATABASE_USER
              value: notification
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fiapx-postgres
                  key: NOTIFICATION_DB_PASSWORD
            - name: SMTP_HOST
              value: mailpit
            - name: SMTP_PORT
              value: "1025"
            - name: SMTP_FROM
              value: fiapx@local
          ports:
            - name: http
              containerPort: 3003
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
