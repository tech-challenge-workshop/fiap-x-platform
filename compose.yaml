services:
  api:
    build: ../fiap-x-api
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - CATALOG_BASE_URL=http://catalog:3001
    depends_on:
      rabbitmq:
        condition: service_healthy
      catalog:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  catalog:
    build: ../processing-catalog
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - LOCAL_INTEGRATION=true
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=fiapx
      - DATABASE_SCHEMA=catalog
      - DATABASE_USER=catalog
      - DATABASE_PASSWORD=catalog
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3001/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  worker:
    build: ../processing-worker
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - RABBITMQ_URL=amqp://rabbitmq:5672
      # Local development credentials only. Nothing here reaches a deployed
      # environment: AD-005 keeps secrets in Kubernetes secrets.
      - STORAGE_ENDPOINT=http://minio:9000
      - STORAGE_BUCKET=fiapx
      - STORAGE_ACCESS_KEY=minioadmin
      - STORAGE_SECRET_KEY=minioadmin
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3002/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  notification:
    build: ../notification-service
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - LOCAL_INTEGRATION=true
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=fiapx
      - DATABASE_SCHEMA=notification
      - DATABASE_USER=notification
      - DATABASE_PASSWORD=notification
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3003/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    user: "0:0"
    # Dead-lettering is applied here as a broker policy, not as a queue
    # argument. Five queues are declared by two services, and RabbitMQ rejects
    # a second declaration whose arguments differ - which closed the Worker's
    # channel with PRECONDITION_FAILED the first time a service tried to own
    # the topology alone. A policy binds no declarer, so nothing can conflict.
    #
    # definitions.json also declares every queue that carries traffic, and its
    # `.dlq`, before any service connects: a publish to a queue nobody has
    # declared yet is confirmed and then dropped. Queues are quorum by vhost
    # default, which a service's plain `durable: true` declaration accepts, so
    # the policy's delivery limit can stop a message that keeps killing its
    # consumer. No volume: the topology is rebuilt from the file on each start.
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/10-fiapx.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17-alpine
    environment:
      # Local development credentials only. Nothing here reaches a deployed
      # environment: AD-005 keeps secrets in Kubernetes secrets.
      - POSTGRES_DB=fiapx
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      # Runs only on an empty volume. See README: a stale volume needs
      # `docker compose down -v`.
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fiapx"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      # Local development credentials only. Nothing here reaches a deployed
      # environment: AD-005 keeps secrets in Kubernetes secrets.
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      # Readiness, not liveness: a TCP probe would pass while the server is
      # listening but not yet serving.
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  minio-data:
