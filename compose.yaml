services:
  api:
    build: ../fiap-x-api
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - CATALOG_BASE_URL=http://catalog:3001
      # The issuer is the public hostname the identity service is pinned to,
      # so a token requested from the host validates inside the network. The
      # key set is fetched from the internal address, not discovered: the
      # discovery document advertises jwks_uri on localhost.
      - OIDC_ISSUER=http://localhost:8080/realms/fiapx
      - OIDC_AUDIENCE=fiapx-api
      - OIDC_JWKS_URL=http://identity:8080/realms/fiapx/protocol/openid-connect/certs
      # Two storage addresses. The API's own calls go to storage:9000 inside
      # the network; the URLs it signs name the port published on the host,
      # because a presigned URL only works on the host it was signed for.
      # Both come from STORAGE_HOST_PORT, so they cannot drift apart.
      # Local development credentials only, the Worker's: nothing here reaches
      # a deployed environment (AD-005).
      - STORAGE_ENDPOINT=http://storage:9000
      - STORAGE_PUBLIC_ENDPOINT=http://localhost:${STORAGE_HOST_PORT:-9000}
      - STORAGE_BUCKET=fiapx
      - STORAGE_ACCESS_KEY=fiapx-dev
      - STORAGE_SECRET_KEY=fiapx-dev-secret
    depends_on:
      rabbitmq:
        condition: service_healthy
      catalog:
        condition: service_healthy
      identity:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  identity:
    # OIDC provider (AD-005). Development mode with its embedded database and
    # no volume: every start imports the realm from the versioned file, so
    # nothing configured by hand in the console outlives a restart. The
    # users' ids are pinned in that file, so their `sub` survives the
    # re-import.
    image: quay.io/keycloak/keycloak:26.7.4
    command: start-dev --import-realm
    environment:
      # Local development credentials only. Nothing here reaches a deployed
      # environment: AD-005 keeps secrets in Kubernetes secrets.
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_HEALTH_ENABLED=true
      # One issuer for every token, whether requested from the host or from
      # inside the network. The API validates exactly this value.
      - KC_HOSTNAME=http://localhost:8080
    ports:
      - "8080:8080"
    volumes:
      - ./identity/fiapx-realm.json:/opt/keycloak/data/import/fiapx-realm.json:ro
    # The embedded database lives in memory, so it is empty on every start,
    # a plain restart included: without this, a restart that keeps the
    # container finds the realm already there, skips the import, and keeps
    # whatever was changed by hand.
    tmpfs:
      - /opt/keycloak/data/h2:uid=1000,gid=0,mode=0770
    healthcheck:
      # The image has bash but no curl or wget, so readiness is read over
      # /dev/tcp from the management port, which stays internal.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '"UP"' <&3
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  catalog:
    build: ../processing-catalog
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - LOCAL_INTEGRATION=true
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=fiapx
      - DATABASE_SCHEMA=catalog
      - DATABASE_USER=catalog
      - DATABASE_PASSWORD=catalog
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3001/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  worker:
    build: ../processing-worker
    # WORKER_CPUS (from .env or the shell) drives both the CPU limit and
    # FFmpeg's thread count, because FFmpeg reads the host's core count, not
    # the cgroup's (AD-006). Compose cannot compute, so the default appears in
    # both places and scripts/check-worker-sizing.mjs fails if the rendered
    # values disagree. Top-level `cpus`, not deploy.resources.limits, which
    # Compose ignores outside Swarm.
    cpus: ${WORKER_CPUS:-2}
    ports:
      # WORKER_HOST_PORT moves only the host side, like POSTGRES_HOST_PORT.
      - "${WORKER_HOST_PORT:-3002}:3002"
    environment:
      - PORT=3002
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - FFMPEG_THREADS=${WORKER_CPUS:-2}
      # Local development credentials only. Nothing here reaches a deployed
      # environment: AD-005 keeps secrets in Kubernetes secrets.
      - STORAGE_ENDPOINT=http://storage:9000
      - STORAGE_BUCKET=fiapx
      - STORAGE_ACCESS_KEY=fiapx-dev
      - STORAGE_SECRET_KEY=fiapx-dev-secret
    depends_on:
      rabbitmq:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3002/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  notification:
    build: ../notification-service
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - LOCAL_INTEGRATION=true
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=fiapx
      - DATABASE_SCHEMA=notification
      - DATABASE_USER=notification
      - DATABASE_PASSWORD=notification
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3003/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    user: "0:0"
    # Dead-lettering is applied here as a broker policy, not as a queue
    # argument. Five queues are declared by two services, and RabbitMQ rejects
    # a second declaration whose arguments differ - which closed the Worker's
    # channel with PRECONDITION_FAILED the first time a service tried to own
    # the topology alone. A policy binds no declarer, so nothing can conflict.
    #
    # definitions.json also declares every queue that carries traffic, and its
    # `.dlq`, before any service connects: a publish to a queue nobody has
    # declared yet is confirmed and then dropped. Queues are quorum by vhost
    # default, which a service's plain `durable: true` declaration accepts, so
    # the policy's delivery limit can stop a message that keeps killing its
    # consumer. No volume: the topology is rebuilt from the file on each start.
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/10-fiapx.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17-alpine
    environment:
      # Local development credentials only. Nothing here reaches a deployed
      # environment: AD-005 keeps secrets in Kubernetes secrets.
      - POSTGRES_DB=fiapx
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      # POSTGRES_HOST_PORT (from .env or the shell) moves only the host side,
      # for a machine where another PostgreSQL already holds 5432. Services
      # always reach postgres:5432 inside the network.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      # Runs only on an empty volume. See README: a stale volume needs
      # `docker compose down -v`.
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fiapx"]
      interval: 5s
      timeout: 3s
      retries: 10

  storage:
    # S3-compatible object storage (AD-005 keeps the port at the protocol, and
    # AD-014 records why this is RustFS: MinIO's public images were withdrawn).
    image: rustfs/rustfs:1.0.0
    environment:
      # Local development credentials only. Nothing here reaches a deployed
      # environment: AD-005 keeps secrets in Kubernetes secrets.
      - RUSTFS_ACCESS_KEY=fiapx-dev
      - RUSTFS_SECRET_KEY=fiapx-dev-secret
    ports:
      # STORAGE_HOST_PORT moves only the host side, like POSTGRES_HOST_PORT.
      # The smoke reads the same variable to reach the bucket from the host;
      # services and storage-init always use storage:9000 in the network.
      - "${STORAGE_HOST_PORT:-9000}:9000"
    volumes:
      - storage-data:/data
    healthcheck:
      # An HTTP probe of the server itself, not a TCP one: a listening socket
      # is not a serving S3 API.
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  storage-init:
    # One-shot: exits 0 once the bucket exists, has no bucket policy and
    # carries its retention rules. The Worker waits for it to complete, so it
    # never starts against a missing bucket. Plain aws-cli: the scripts speak
    # the S3 API, not a vendor's CLI.
    image: amazon/aws-cli:2.37.4
    entrypoint: ["/bin/bash", "/bootstrap.sh"]
    environment:
      # Local development credentials only. Nothing here reaches a deployed
      # environment: AD-005 keeps secrets in Kubernetes secrets.
      - AWS_ACCESS_KEY_ID=fiapx-dev
      - AWS_SECRET_ACCESS_KEY=fiapx-dev-secret
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://storage:9000
      - STORAGE_BUCKET=fiapx
    volumes:
      - ./storage/bootstrap.sh:/bootstrap.sh:ro
    depends_on:
      storage:
        condition: service_healthy

volumes:
  postgres-data:
  storage-data:
